name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: animefav_test
          MYSQL_USER: animefav_user
          MYSQL_PASSWORD: animefav_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 3002
      DB_HOST: 127.0.0.1
      DB_USER: animefav_user
      DB_PASS: animefav_password
      DB_NAME: animefav_test
      DATABASE_URL: mysql://animefav_user:animefav_password@127.0.0.1:3306/animefav_test
      JWT_SECRET: test_secret_solo_para_ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy
      MAIL_HOST: sandbox.smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_USER: dummy
      MAIL_PASS: dummy

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      - name: Aplicar migraciones de Prisma sobre la BD de test
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Ejecutar tests
        working-directory: ./backend
        run: npm test